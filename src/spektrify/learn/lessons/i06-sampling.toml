id = "sampling"
title = "Sampling, aliasing and pyramids"
summary = "Sample too coarsely and fine patterns turn into fake coarse ones. Blur first, and build image pyramids to work at every scale."
level = "intermediate"
unit = "Filters"
order = 60
demo = "scene"
reading = [
  "Gonzalez & Woods, *Digital Image Processing* (4th ed.), ch. 4: sampling, the sampling theorem, aliasing.",
  "Torralba, Isola & Freeman, *Foundations of Computer Vision*, chapters on sampling, aliasing and image pyramids.",
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 3: pyramids and wavelets.",
]

[[steps]]
title = "A pattern with every frequency"
text = """
This **zone plate**, `cos(((x - 128)**2 + (y - 96)**2) / 150)`, has rings that get finer from the centre outwards, so it
contains every spacing from coarse to fine. At full resolution every ring is drawn
correctly: even the finest ones, at the corners, still have more than 2 pixels per ring.
"""
show = { mode = "math", mathExpr = "cos(((x - 128)**2 + (y - 96)**2) / 150)", cmap = "gray" }

[[steps]]
title = "Aliasing"
text = """
Now keep only every 4th pixel in each direction: `subsample(…, 4)`. The centre is fine, but
further out **new rings appear, centred in the wrong places**. Rings finer than the new pixel
spacing don't simply disappear: each sample lands a little further along the pattern than
the one before, and that slow drift draws a fake, coarser pattern. This is **aliasing**.
Moiré on photos of fabric or screens is the same effect.
"""
show = { mode = "math", mathExpr = "subsample(cos(((x - 128)**2 + (y - 96)**2) / 150), 4)", cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "The sampling theorem says how many samples per period a pattern needs to be captured faithfully. How many?"
options = ["At least 1", "More than 2", "At least 10"]
answer = 1
success = "Right: more than two per period (the Nyquist rate). Sampling every 4th pixel can only represent patterns coarser than 8 pixels per period."
retry = "A wave goes up and down once per period; you need to catch both."

[[steps]]
title = "Blur before you shrink"
text = """
The fix is to remove the patterns that are too fine for the new grid *before* sampling:
`subsample(gauss(…, 3), 4)`. The outer rings turn grey instead of turning into false
rings. You lose detail you couldn't have kept anyway, but you no longer invent detail.

Cameras do the same with an optical anti-aliasing filter. Whenever you shrink an image (for
display, or for a neural network's input), blur first or use a resize method that does.
"""
show = { mode = "math", mathExpr = "subsample(gauss(cos(((x - 128)**2 + (y - 96)**2) / 150), 3), 4)", cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "Fabric whose weave repeats every 1.5 pixels on the sensor. What will the photo show?"
options = [
  "Moiré: a false, coarser pattern, unless the optics blur the weave first",
  "The weave, perfectly sharp",
  "Nothing: the weave is simply invisible",
]
answer = 0
success = "Right: 1.5 pixels per period is fewer than 2 samples per period, so the weave aliases into a coarse false pattern."
retry = "Compare 1.5 pixels per period with the Nyquist rate."

[[steps]]
title = "Image pyramids"
text = """
Repeat *blur and halve* and you get a **Gaussian pyramid**: the same image at 1, 1/2, 1/4…
of the size, each level safely blurred before shrinking. The difference between two
levels keeps one band of frequencies, a **Laplacian pyramid**. This one is a difference of
two blurs: `gauss(nm(800), 2) - gauss(nm(800), 4)`.

Pyramids let algorithms work coarse-to-fine: find a rough match on a small image, refine it
on larger ones. Registration, optical flow, blending and the pooling layers of neural
networks all use the idea.
"""
show = { mode = "math", mathExpr = "gauss(nm(800), 2) - gauss(nm(800), 4)", cmap = "diverging" }

[steps.task]
kind = "choice"
prompt = "Why search for a large shift on a coarse pyramid level first?"
options = [
  "A 32-pixel shift is only 2 pixels at 1/16 scale, so the search is small and fine detail can't mislead it",
  "Coarse images are more accurate",
  "It is the only way to compute a shift",
]
answer = 0
success = "Right. Coarse levels give a fast, robust first guess; fine levels give accuracy."
retry = "What happens to the size of a shift when the image shrinks?"
