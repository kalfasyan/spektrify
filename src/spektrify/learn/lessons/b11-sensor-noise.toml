id = "sensor-noise"
title = "Exposure, noise and dynamic range"
summary = "Shot noise, read noise and saturation: how much light you collect sets how precise every pixel is, and what too much light destroys."
level = "basics"
unit = "How images are captured"
order = 52
demo = "scene"
reading = [
  "J. R. Janesick, *Photon Transfer: DN → λ* (SPIE Press, 2007): measuring a sensor's gain, noise and full well from its own images.",
  "European Machine Vision Association, *EMVA Standard 1288* (release 4.0, 2021): the standard sensor noise model.",
  "G. E. Healey and R. Kondepudy, 'Radiometric CCD camera calibration and noise estimation', *IEEE TPAMI* 16(3), 1994.",
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 2: the digital camera, sampling and noise.",
]

[[steps]]
title = "A simulated sensor"
figure = { kind = "sensor", show = "counts" }
text = """
*Light and what a pixel measures* showed that a pixel counts electrons and turns them into
counts. Those counts are never exact: this lesson is about how precise they are.

`expose(image, t)` shows what a simple, made-up sensor would record if the image were the
light reaching it and t the exposure. Its numbers are typical of a machine-vision camera:

- a white surface at t = 1 gives **1,000 electrons** on average,
- each pixel holds at most **10,000 electrons** (the **full well**),
- the readout adds **5 electrons** of noise,
- a **12-bit** ADC turns 0 to 10,000 electrons into 0 to 4,095 counts.

Here is the 550 nm band at t = 1: `expose(nm(550), 1)`. The background reflects about 18%,
so each of its pixels collects about 186 electrons.
"""
show = { mode = "math", mathExpr = "expose(nm(550), 1)", cmap = "gray" }

[[steps]]
title = "Shot noise: light itself is grainy"
figure = { kind = "sensor", show = "shot" }
text = """
Photons arrive at random, like raindrops. If a pixel expects N photons per exposure, the
count it actually gets varies from shot to shot. The **standard deviation** measures that
spread: the typical distance of a measurement from its average. For photons it is **√N**
(a Poisson distribution). This **shot noise** is a property of light, not of the camera,
so no sensor can beat it.

So the **signal-to-noise ratio (SNR)** from shot noise alone is **N / √N = √N**. Collecting
four times the light only doubles the SNR. At t = 1 the background gets about 186
electrons: SNR ≈ 13, which is the speckle you see.
"""

[steps.task]
kind = "choice"
prompt = "A pixel collects 10,000 electrons. What is its shot-noise-limited SNR?"
options = ["50", "100", "1,000", "10,000"]
answer = 1
success = "Right: √10,000 = 100, so the value is uncertain by about 1%. Getting to 0.1% would take 100 times more light (a million electrons), more than one pixel can hold, so you average pixels or frames instead."
retry = "Shot-noise SNR is √N."

[[steps]]
title = "Too little light"
text = """
Now t = 0.05: `expose(nm(550), 0.05)`. The background gets only about 9 electrons, and
the image is mostly noise.

Two independent noises don't add their standard deviations; they add their **variances**
(the variance is the standard deviation squared, σ²). Shot noise has variance N, read noise
σ_read², so **SNR = N / √(N + σ_read²)**. With N = 9 and
σ_read = 5 electrons, SNR ≈ 1.6. In the dark, the **read noise** of the electronics
dominates. The discs collect more light, so they still stand out a little.
"""
show = { mode = "math", mathExpr = "expose(nm(550), 0.05)", cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "At very low light, which noise sets the limit?"
options = [
  "Read noise, because it stays the same however weak the signal",
  "Shot noise, because it is always the largest of the noise sources",
  "Quantisation, because dim values use only a few levels",
]
answer = 0
success = "Right. Shot noise is √N, which becomes small in absolute terms when N is small; read noise stays at about 5 electrons. Low-read-noise sensors (and cooling) matter most in dim scenes."
retry = "Which noise stays the same size however little light arrives?"

[[steps]]
title = "Too much light"
figure = { kind = "sensor", show = "saturate" }
text = """
Now t = 40: `expose(nm(550), 40)`. The background is cleaner (about 7,400 electrons, shot
SNR about 86), but the four discs reflect about 42 to 46% and would need more than
16,000 electrons, so every one of their pixels hits the **full well** and reads 4,095.

A **saturated** (clipped) pixel has lost its information: the shading on the discs is
gone, and any number computed from it, such as a ratio of two bands, is wrong without
looking wrong. The usual rule is to expose so the **brightest thing you care about** sits
just below full well.
"""
show = { mode = "math", mathExpr = "expose(nm(550), 40)", cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "A disc reads 4,095 in band A and 2,000 in band B. What can you say about its ratio A / B?"
options = [
  "It is exactly 2.05, the ratio of the two readings",
  "It is about 1, since a saturated pixel is simply white",
  "It is at least 2.05, and maybe far more: A is clipped",
]
answer = 2
success = "Right. Clipping only tells you the value was at least the maximum. Spectral tools should mask saturated pixels, as the lesson on sensor problems does."
retry = "4,095 is the largest number the ADC can output. What was the true value?"

[[steps]]
title = "Dynamic range and bit depth"
text = """
The **dynamic range** is the ratio of the largest signal to the noise floor:
**full well / read noise**. Here 10,000 / 5 = 2,000 : 1.

To record that range in steps no bigger than the noise, the ADC needs about 2,000 levels.
Since n bits give 2ⁿ levels, count how many doublings reach the ratio: 2¹¹ = 2,048, so
**about 11 bits**. (Engineers also write it in decibels, 20 · log₁₀(2,000) ≈ 66 dB.)

That is why a 12-bit ADC suits this sensor. Fewer bits would add rounding steps larger than
the noise (the false contours from *What is a digital image?*); many more bits would only
record the noise more finely. The **gain**, 10,000 / 4,095 ≈ 2.4 electrons per count, ties
counts back to electrons.
"""

[steps.task]
kind = "choice"
prompt = "A sensor holds 20,000 electrons and has 2 electrons of read noise. Which ADC suits it?"
options = ["8-bit", "10-bit", "14-bit", "24-bit"]
answer = 2
success = "Right: 20,000 / 2 = 10,000 : 1, about 13.3 bits, so 14 bits covers it with no waste."
retry = "Compute full well / read noise, then the number of bits: 2^bits should just exceed it."

[[steps]]
title = "Dark current and fixed patterns"
text = """
Two more sources finish the picture:

- **Dark current**: heat frees electrons even with no light. It grows with exposure time
  and roughly doubles every 6 to 8 °C, which is why scientific cameras are cooled. Its
  average adds to the offset; its randomness adds noise.
- **Fixed-pattern noise**: each pixel has a slightly different offset and sensitivity
  (DSNU and PRNU in the EMVA 1288 standard). It is the same in every frame. Hot and dead
  pixels are its extreme cases.

Random noise shrinks when you average frames: averaging N frames divides its standard
deviation by **√N**, for the same reason that shot noise grows only as √N. Fixed patterns
don't shrink, but they can be measured once and subtracted (a dark frame) or divided out
(a flat field).

Next, *Lenses, focus and blur* moves in front of the sensor, to the lens that forms the
image.
"""

[steps.task]
kind = "choice"
prompt = "You average 16 frames of a still scene. What happens?"
options = [
  "All noise drops 16 times",
  "Both kinds of noise drop 4 times",
  "Random noise drops 16 times; fixed patterns stay",
  "Random noise drops 4 times; fixed patterns stay",
]
answer = 3
success = "Right: averaging n frames divides random noise by √n = 4, and leaves anything that repeats in every frame. Calibration frames handle that part."
retry = "Averaging cancels what changes between frames. Does a fixed pattern change?"
