id = "edges"
title = "Gradients and edges"
summary = "Edges are where brightness changes fast: derivatives, the Sobel operator, why you smooth first, and how Canny builds clean edge maps."
level = "intermediate"
unit = "Filters"
order = 30
demo = "scene"
reading = [
  "Gonzalez & Woods, *Digital Image Processing* (4th ed.), ch. 3 (derivatives, Laplacian, gradient) and ch. 10 (edge detection, Marr–Hildreth, Canny).",
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 7: edge detection.",
  "J. Canny, 'A computational approach to edge detection', *IEEE TPAMI* 8(6), 1986.",
]

[[steps]]
title = "A derivative is a difference"
figure = { kind = "kernel", op = "dx" }
text = """
The last two lessons averaged neighbours to remove noise. Taking their difference instead
finds the places where the image changes: the edges.

An edge is a place where brightness changes quickly. On a pixel grid, the derivative is a
difference between neighbours. The **Sobel** operator takes the difference left to right and
averages it over three rows to resist noise: `dx(nm(800))`.

The diverging colour map shows the sign: red where the image gets brighter to the right,
blue where it gets darker, pale where nothing changes.
"""
show = { mode = "math", mathExpr = "dx(nm(800))", cmap = "diverging" }

[steps.task]
kind = "choice"
prompt = "The leaf is bright in the near infrared. Why is its left edge red and its right edge blue?"
options = [
  "The leaf is lit from the left, so its left edge is the brightest",
  "The colour map is reversed on the right half of the image",
  "dx is positive entering the bright leaf and negative leaving it",
]
answer = 2
success = "Right. dx is positive entering a bright object and negative leaving it. Horizontal edges barely show in dx; dy catches those."
retry = "Follow a row from left to right: where does the value go up, and where down?"

[[steps]]
title = "Gradient magnitude"
text = """
Combine both directions into the **gradient magnitude** `sqrt(dx² + dy²)`:
`grad(nm(800))`. It is large on every outline, whatever its direction. The direction of the
gradient (`atan2(dy, dx)`) points across the edge, from dark to bright.
"""
show = { mode = "math", mathExpr = "grad(nm(800))", cmap = "gray" }

[[steps]]
title = "Derivatives amplify noise"
text = """
Differences between neighbours magnify anything that changes from pixel to pixel, which is
exactly what noise does. On the noisy band 4 the gradient is pure static:
`grad(b[4])`. Try `grad(gauss(b[4], 2))` in the band-math box: smooth first, then
differentiate, and the outlines come back. σ sets the scale of the edges you find: a small
σ keeps fine edges (and some noise), a large σ smooths both away and leaves only the coarse
outlines.

Because convolution is associative, *blur then differentiate* is one filter: the
**derivative of a Gaussian**, the standard edge filter.
"""
show = { mode = "math", mathExpr = "grad(b[4])", cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "What does a larger σ in the smoothing step do to the edges you find?"
options = [
  "More, finer edges: the smoothing makes them easier to see",
  "Fewer, coarser edges: fine detail and noise are smoothed away",
  "The same edges as before, only with less noise in between them",
]
answer = 1
success = "Right. σ picks the scale of the edges, a trade-off between noise and detail."
retry = "Think about what blur removes before the derivative sees it."

[[steps]]
title = "Edges depend on the band"
text = """
In a spectral image an edge can exist in one band and vanish in another. At 709 nm the leaf
and the background reflect almost the same amount, so the leaf's outline nearly disappears:
`grad(nm(709))`.

Summing gradients over several bands (or computing them on PCA components) finds edges that
any one band would miss.
"""
show = { mode = "math", mathExpr = "grad(nm(709))", cmap = "gray" }

[steps.task]
kind = "pixel"
region = "pill_a"
prompt = "Click an object whose outline is still clear at 709 nm."
success = "The upper discs are much brighter than the background at 709 nm, so their edges remain."
retry = "Find an outline that is still bright in this image."

[[steps]]
title = "Second derivatives and Canny"
figure = { kind = "kernel", op = "laplace" }
text = """
The **Laplacian** (`laplace`) is the second derivative: zero on flat areas and even ramps,
crossing zero right on an edge. Smoothed first (*Laplacian of Gaussian*), its zero crossings
give thin, closed outlines (Marr and Hildreth).

**Canny's detector** is the classic recipe: Gaussian smoothing, gradient, **non-maximum
suppression** (keep only the peak across each edge, so edges are one pixel thin) and
**hysteresis** (a high threshold to start an edge, a lower one to continue it).

Next, *Sharpening* uses the same differences to make edges look crisper.
"""
show = { mode = "math", mathExpr = "laplace(gauss(nm(800), 2))", cmap = "diverging" }

[steps.task]
kind = "choice"
prompt = "Why does Canny use two thresholds?"
options = [
  "Weak edge pixels are kept only where they connect to strong ones",
  "One threshold is for horizontal edges, the other for vertical ones",
  "One threshold finds rising edges, the other finds falling ones",
]
answer = 0
success = "Exactly. Hysteresis uses connectivity as evidence: a faint pixel on a strong edge is probably real."
retry = "Think about a long edge whose strength dips in places."
