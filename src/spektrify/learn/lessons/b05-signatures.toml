id = "signatures"
title = "Comparing materials"
summary = "Brightness versus shape, and how spectral angle finds the same material in shade."
level = "basics"
unit = "Images and spectra"
order = 50
demo = "scene"
reading = [
  "F. A. Kruse et al., 'The spectral image processing system (SIPS)', *Remote Sensing of Environment* 44, 1993 (introduces the spectral angle mapper).",
  "Gonzalez & Woods, *Digital Image Processing* (4th ed.), ch. 6: colour (vector) segmentation and distances.",
]

[[steps]]
title = "Same material, different brightness"
figure = { kind = "spectrum", show = "angle" }
text = """
*Colour and composites* showed that three numbers can't tell some materials apart. This
lesson compares whole spectra instead.

The four discs are lit from above, so their edges are darker than their centres. The material
is the same everywhere on a disc; only the amount of light differs.
"""
show = { mode = "rgb", rgb = [640, 550, 465], specView = "values" }

[steps.task]
kind = "pixel"
region = "pill_a"
prompt = "Pin a pixel near the centre of one of the two upper discs."
success = "Got it. Now we need a second pin on the same disc."
retry = "That's not one of the two upper discs on the right."

[[steps]]
title = "Now the edge"
text = "Shading scales a whole spectrum up or down without changing its shape."

[steps.task]
kind = "pixel"
region = "pill_a"
prompt = "Pin a pixel near the edge of the same disc."
success = "Two curves at different heights for one material. Comparing raw values would call them different."
retry = "Stay on the same upper disc, close to its edge."

[[steps]]
title = "Compare shapes"
text = """
The **Shape** view of the plot divides each curve by its own mean. Brightness is gone and
the two pins now lie on top of each other: the material's fingerprint is its shape.
"""
show = { specView = "normalized" }

[[steps]]
title = "Spectral angle"
text = """
**Spectral angle** turns each spectrum into an arrow. With just two bands it is easy to
draw: plot a pixel as a point, with its value in band 1 across and its value in band 2 up,
and draw the arrow from the origin (0, 0) to that point. A shaded pixel of the same
material has both values halved, so its arrow is shorter but points in exactly the same
direction. A different material has a different ratio between the bands, so its arrow
points elsewhere.

With 96 bands the space has 96 axes, which nobody can draw, but the angle between two
arrows is computed the same way. Brightness changes an arrow's length, not its direction,
so shaded pixels of the same material stay close.

Open one of your pins' menu (right-click it, or press and hold on a touch screen) and
choose **Find similar pixels**. Dark means a small angle,
that is, similar.

The spectra here are clean values between 0 and 1. The next unit asks where such numbers
come from: *Light and what a pixel measures* follows the light from the lamp into the
camera.
"""
show = { mode = "similarity", simDeg = 5, specView = "values" }

[steps.task]
kind = "choice"
prompt = "Why does spectral angle find both upper discs, shaded edges included?"
options = [
  "Both discs have the same brightness, shaded edges included",
  "The angle compares only the shape of the spectra, not brightness",
  "The angle favours pixels that lie close to each other in the image",
]
answer = 1
success = "Yes. That makes spectral angle robust to shading and illumination changes."
retry = "Think about what happens to an arrow when you only make it longer or shorter."
