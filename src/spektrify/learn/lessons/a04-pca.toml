id = "pca"
title = "Principal component analysis"
summary = "Neighbouring bands repeat each other; PCA finds the few directions that carry the variation."
level = "advanced"
unit = "Statistics without labels"
order = 40
reading = [
  "Bishop, *Pattern Recognition and Machine Learning*, ch. 12.1: principal component analysis.",
  "Prince, *Computer Vision: Models, Learning, and Inference*, ch. 17: models for shape (and PCA as a subspace model).",
  "Gonzalez & Woods, *Digital Image Processing* (4th ed.), ch. 12: principal components as feature descriptors.",
]

[[steps]]
title = "Many bands, few stories"
figure = { kind = "scatter", show = "pca" }
text = """
Neighbouring bands are highly correlated: band 600 nm looks almost exactly like 605 nm.
**PCA** finds new axes, mixtures of all bands, ordered by how much of the variation in the
cube they carry. Here the first three are shown as red, green and blue.

The label at the top of the image shows how much variance each component explains.
"""
show = { mode = "pca", pcaOffset = 0, pcaAsRgb = true }

[steps.task]
kind = "choice"
prompt = "What does 'variance explained' tell you?"
options = [
  "How much of the cube's variation those components capture",
  "How many objects are in the scene",
  "The noise level of each band",
]
answer = 0
success = "Right. Often a handful of components carry almost all the variation of a hundred bands."
retry = "It's about the variation in the data, not counting objects."

[[steps]]
title = "Later components"
text = """
Later components carry less structure and more noise, plus anything rare: stripes, dead
columns, small targets. Step through them with **← →** and watch the image change from
scene to noise.
"""
show = { mode = "pca", pcaOffset = 3, pcaAsRgb = true }

[[steps]]
title = "Largest is not always most useful"
text = """
Mathematically, the components are the **eigenvectors of the band covariance matrix**,
sorted by their eigenvalues (the variance along each). They are uncorrelated with each
other, and keeping the first k gives the best k-dimensional approximation of the data in
the least-squares sense.

But PCA only knows variance, not which variation you care about. In real data the first
components often follow illumination and brightness, while a small, rare target adds so
little variance overall that its signal can end up in a late component.
"""
show = { mode = "pca", pcaOffset = 0, pcaAsRgb = false }

[steps.task]
kind = "choice"
prompt = "You keep the first 3 components to train a classifier for a rare defect. What is the risk?"
options = [
  "The defect's signal may sit in a component you dropped, because it adds little variance overall",
  "None: the first components always contain everything important",
  "The classifier will be slower",
]
answer = 0
success = "Right. PCA is unsupervised; for a task, check what the dropped components contain or use a supervised reduction such as LDA."
retry = "PCA ranks by variance over the whole image. How much variance can a few pixels add?"

[[steps]]
title = "The cube as a cloud of points"
text = """
Place every pixel as a point at its first three component scores and materials become
**clusters**. In the 3D view, choose **PCA cloud**, then rotate. Points that sit far from
every cluster are unusual pixels.
"""
view = "3d"
