id = "pca"
title = "Principal component analysis"
summary = "Neighbouring bands repeat each other; PCA finds the few directions that carry the variation."
level = "advanced"
unit = "Statistics without labels"
order = 40
reading = [
  "Bishop, *Pattern Recognition and Machine Learning*, ch. 12.1: principal component analysis.",
  "Prince, *Computer Vision: Models, Learning, and Inference*, ch. 17: models for shape (and PCA as a subspace model).",
  "Gonzalez & Woods, *Digital Image Processing* (4th ed.), ch. 12: principal components as feature descriptors.",
]

[[steps]]
title = "Many bands, few stories"
figure = { kind = "scatter", show = "pca" }
text = """
The geometry lessons were about positions. This unit treats the spectra as data, starting
with how much new information all those bands really hold.

Flip between band 600 nm and band 605 nm and you will hardly see a difference. Neighbouring
bands are highly **correlated**: when one is bright, so is the other. So 96 bands don't hold
96 independent pieces of information; much of it is repeated.

**Principal component analysis (PCA)** finds the few directions that carry most of the
information. To measure "information" it uses **variance**: how much values spread around
their average (the standard deviation squared). A band in which every pixel has the same
value tells you nothing; a band where pixels differ a lot tells you a lot.

PCA builds new "bands", called **components**, each a weighted mix of all the original
bands. The first component is the mix along which the pixels differ the most; the second
differs the most among what is left, and so on. Here the first three are shown as red,
green and blue. The label at the top of the image shows what share of the cube's total
variation each component captures.
"""
show = { mode = "pca", pcaOffset = 0, pcaAsRgb = true }

[steps.task]
kind = "choice"
prompt = "What does 'variance explained' tell you?"
options = [
  "How much of the cube's variation those components capture",
  "How many different materials are present in the scene",
  "How much noise each band contains, from the worst band to the best",
]
answer = 0
success = "Right. Often a handful of components carry almost all the variation of a hundred bands."
retry = "It's about the variation in the data, not counting objects."

[[steps]]
title = "Later components"
text = """
Later components carry less structure and more noise, plus anything rare: stripes, dead
columns, small targets. Step through them with the **‹ ›** buttons in the Display panel and watch the image change from
scene to noise.
"""
show = { mode = "pca", pcaOffset = 3, pcaAsRgb = true }

[[steps]]
title = "Largest is not always most useful"
text = """
For the record, here is how they are computed. Make a table of how every pair of bands
varies together (the **covariance matrix**, 96 × 96 here). Its **eigenvectors** are the
components, and its **eigenvalues** are the variance along each, which sets their order. They are uncorrelated with each
other, and keeping the first k gives the best k-dimensional approximation of the data in
the least-squares sense.

But PCA only knows variance, not which variation you care about. In real data the first
components often follow illumination and brightness, while a small, rare target adds so
little variance overall that its signal can end up in a late component.
"""
show = { mode = "pca", pcaOffset = 0, pcaAsRgb = false }

[steps.task]
kind = "choice"
prompt = "You keep the first 3 components to train a classifier for a rare defect. What is the risk?"
options = [
  "None: the first components always keep everything that matters",
  "A rare defect adds little variance, so it may be dropped",
  "The classifier will run slower, because it has fewer inputs",
]
answer = 1
success = "Right. PCA is unsupervised; for a task, check what the dropped components contain or use a supervised reduction such as LDA."
retry = "PCA ranks by variance over the whole image. How much variance can a few pixels add?"

[[steps]]
title = "The cube as a cloud of points"
text = """
Place every pixel as a point at its first three component scores and materials become
**clusters**. In the 3D view, choose **PCA cloud**, then rotate. Points that sit far from
every cluster are unusual pixels.

Clusters in that cloud are groups of similar pixels. Next, *Clustering into segments*
finds them automatically.
"""
view = "3d"
