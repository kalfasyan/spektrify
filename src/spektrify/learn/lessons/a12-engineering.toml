id = "engineering"
title = "Thinking like a senior engineer"
summary = "Capstone: real scenarios on debugging order, baselines, failure analysis, throughput budgets and drift in production."
level = "advanced"
unit = "Learning from data"
order = 120
demo = "capture"
reading = [
  "Goodfellow, Bengio & Courville, *Deep Learning*, ch. 11: practical methodology.",
  "D. Sculley et al., 'Hidden technical debt in machine learning systems', *NeurIPS*, 2015.",
  "A. Karpathy, 'A recipe for training neural networks', 2019 (blog post).",
]

[[steps]]
title = "Start from the data"
text = """
This last lesson uses everything so far, from light and calibration to models, on one real
problem.

A sorting system has worked for months. After the lamp was replaced, accuracy dropped. The
model, code and samples haven't changed.

Experienced engineers debug in the order the data flows: **light → sensor → calibration →
preprocessing → features → model**, and check each stage with a picture or a number before
touching the next. This cube is raw capture data: the lamp's spectrum is in every count.
"""
show = { mode = "band", band = 700, specView = "values" }
pipeline = []

[steps.task]
kind = "choice"
prompt = "What do you check first?"
options = [
  "Whether the model needs retraining, perhaps with more layers",
  "Whether calibration uses current dark and white references",
  "Whether the decision threshold should be lowered",
]
answer = 1
success = "Right. A new lamp changes the illumination spectrum; stale white references turn that into a shift in every 'reflectance'."
retry = "What changed? Follow the light."

[[steps]]
title = "Baselines first"
text = """
Before a deep network, try the simplest method that could work: a vegetation index with a
threshold, spectral angle to a reference, logistic regression on a few bands. It takes an
hour, it tells you how hard the problem really is, and it is a sanity check for everything
that follows. Many production systems never need more.
"""

[steps.task]
kind = "choice"
prompt = "Your deep model scores 0.91 IoU; a threshold on an index scores 0.89. What does this tell you?"
options = [
  "The extra complexity buys little; weigh it against its costs",
  "The deep model is clearly better and should be used",
  "The index must have a bug, since it comes so close to the model",
]
answer = 0
success = "Right. Without the baseline, 0.91 would have looked impressive."
retry = "How much does the complex model actually add?"

[[steps]]
title = "Read the failures"
text = """
The model's errors cluster along object edges, in every image, always on the same side
of the objects. Patterns in the errors point to causes far better than the overall score.
This capture has a known issue of exactly that kind: zoom into an edge.
"""
show = { mode = "rgb", rgb = [830, 640, 545] }

[steps.task]
kind = "choice"
prompt = "What is the most likely cause?"
options = [
  "Band misregistration: edge pixels mix object and background",
  "Too few training epochs, so the model never learned the edges",
  "The colour map hides the edges in the display",
]
answer = 0
success = "Right. Fix it upstream (the align step), not by training the model to live with it."
retry = "Same side, every image, only at edges: which preprocessing lesson does that recall?"

[[steps]]
title = "Budgets"
text = """
A line must handle 100 items per second. Each item is a 256 × 256 cube with 96 bands in
16-bit integers: 256 × 256 × 96 × 2 bytes ≈ 12.6 MB per cube.
"""

[steps.task]
kind = "choice"
prompt = "About 1.26 GB per second is too much for your link. Which change cuts the data the most while keeping what the model needs?"
options = [
  "Save the frames as JPEG, which compresses them about tenfold",
  "Keep only the bands the task needs, and crop to the item",
  "Buy a bigger GPU to keep up with the data rate",
]
answer = 1
success = "Right. Ten well-chosen bands are a tenfold saving. Lossy image compression would distort the spectra."
retry = "Reduce the data at the source, without destroying the spectra."

[[steps]]
title = "Ship and watch"
text = """
In production the world drifts: lamps age, sensors warm up, suppliers change materials.
Monitor the **inputs** (the white reference's spectrum, mean spectra, the fraction of
saturated pixels) as well as the outputs, and alert when they move. Version data, code and
models together, so any result can be reproduced.

That's the course. You now have the toolkit: pixels and spectra, filters and frequencies,
shapes, geometry, statistics, learning, and the judgement to put them together.
"""
view = "quality"

[steps.task]
kind = "choice"
prompt = "Which signal warns you earliest that the lamp is ageing?"
options = [
  "A slow drift in the white reference's raw spectrum",
  "A drop in the model's accuracy, as reported by customers",
  "A change in the size of the saved files over time",
]
answer = 0
success = "Right. Watch the inputs, and you see problems before the outputs fail."
retry = "Which measurement sees the lamp directly?"
