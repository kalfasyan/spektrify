id = "spectral"
title = "Smoothing and normalising spectra"
summary = "Savitzky–Golay smoothing, derivatives and SNV: the standard pre-treatments before modelling."
level = "intermediate"
unit = "From raw data to clean data"
order = 130
demo = "scene"
reading = [
  "A. Savitzky & M. J. E. Golay, 'Smoothing and differentiation of data by simplified least squares procedures', *Analytical Chemistry* 36(8), 1964.",
  "R. J. Barnes, M. S. Dhanoa & S. J. Lister, 'Standard normal variate transformation and de-trending of near-infrared diffuse reflectance spectra', *Applied Spectroscopy* 43(5), 1989.",
]

[[steps]]
title = "Noisy spectra"
figure = { kind = "spectrum", show = "smooth" }
text = """
The previous lessons cleaned the images. This one cleans each pixel's spectrum.

Every measurement has noise, so a single pixel's spectrum is jagged. Here the image shows the
raw data.
"""
show = { mode = "rgb", rgb = [640, 550, 465], specView = "values" }
pipeline = []

[steps.task]
kind = "pixel"
region = "leaf"
prompt = "Pin a pixel on the leaf and look at how jagged its curve is."
success = "Each band's value wobbles around the true curve. Smoothing helps."

[[steps]]
title = "Savitzky–Golay smoothing"
text = """
The obvious fix is a moving average along the spectrum: replace each band by the mean of
it and its neighbours. That smooths the noise, but it also flattens narrow peaks, because a
peak's top gets averaged with its lower sides.

**Savitzky–Golay** smoothing is smarter. For each band it takes a small window of
neighbouring bands, fits a smooth curve through them (a low-degree polynomial, such as a
parabola, by least squares) and keeps the curve's value at the centre. A parabola can bend
to follow a peak, so peaks keep their height and width much better than with a plain
average.

Toggle **Before / After** and watch the leaf's curve.
"""
pipeline = [{ name = "smooth", params = { window = 9, order = 2 } }]

[[steps]]
title = "Derivatives"
text = """
The fitted curve also gives the **derivative** for free: its slope, which says how fast the
spectrum rises or falls per nanometre.
Derivatives remove constant offsets and turn slopes into peaks, so the red edge becomes a
single peak.
"""
pipeline = [{ name = "smooth", params = { window = 9, order = 2, deriv = 1 } }]

[steps.task]
kind = "band"
prompt = "Find the band where the leaf's derivative peaks."
near = 715
tolerance = 20
success = "The peak of the first derivative marks the red edge position, a common plant-stress indicator."
retry = "Look for the highest point of the leaf's curve in the plot and click there."

[[steps]]
title = "Standard normal variate"
figure = { kind = "spectrum", show = "snv" }
text = """
**SNV** (standard normal variate) puts every spectrum on the same footing. It subtracts
the spectrum's own average, so it is centred on zero, and divides by its own standard
deviation (its typical spread), so it has the same overall size as every other spectrum. Like the Shape
view, it removes brightness and shading, but it changes the data itself, ready for modelling.

That completes the intermediate level. The advanced level starts with *Corners and local
features*: finding points that can be matched between images.
"""
pipeline = [{ name = "snv" }]

[steps.task]
kind = "pixel"
region = "pill_a"
prompt = "Pin the centre and the edge of one upper disc, then toggle Before / After."
success = "With SNV on, curves of the same material collapse onto each other."
retry = "Pin pixels on one of the two upper discs."

[[steps]]
title = "Check yourself"
text = "Every pre-treatment removes something. Make sure it isn't the thing you want to measure."

[steps.task]
kind = "choice"
prompt = "When is SNV a bad idea?"
options = [
  "When spectra come from different lighting conditions",
  "When absolute brightness is what you want to measure",
  "Never: removing scale differences always helps",
]
answer = 1
success = "Right. SNV throws away overall level on purpose."
retry = "Think about what SNV removes."
