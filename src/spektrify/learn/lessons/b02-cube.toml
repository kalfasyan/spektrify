id = "cube"
title = "What is a spectral cube?"
summary = "A stack of pictures, one per wavelength, where every pixel holds a whole spectrum."
level = "basics"
unit = "Images and spectra"
order = 20
demo = "scene"
reading = [
  "Gonzalez & Woods, *Digital Image Processing* (4th ed.), ch. 1 (the electromagnetic spectrum) and ch. 6 (multispectral images as vectors).",
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 2: the digital camera and colour.",
  "G. Lu & B. Fei, 'Medical hyperspectral imaging: a review', *J. Biomedical Optics* 19(1), 2014 (a readable introduction to cubes outside remote sensing).",
]

[[steps]]
title = "A stack of pictures"
figure = { kind = "cube", focus = "stack" }
text = """
The previous lesson treated an image as one grid of numbers, measured at a single
wavelength. A spectral cube stacks many such grids.

First, what is a wavelength? Light is a **wave**. Picture the ripples that spread across a
pond when you drop a stone in, or a long rope that you flick up and down: a pattern of
high points (**crests**) and low points (troughs) travels along it. The **wavelength** is
the distance from one crest to the next. Light is not made of water or rope (it is a wave
of electric and magnetic fields), but it has crests all the same.

Those crests are extremely close together, so light's wavelength is measured in
**nanometres** (nm): a nanometre is a millionth of a millimetre. Green light has a
wavelength of about 550 nm, so more than a hundred of its crests fit across the width of a
human hair.

Our eyes turn wavelength into **colour**, much as our ears turn the spacing of sound waves
into pitch. The longest waves we can see look red (about 650 to 700 nm), the shortest
violet (about 400 nm), and a rainbow is simply all of them laid out in order. Waves longer
than about 700 nm are **near infrared**: real light, but invisible to us, like a note too
low to hear.

Now the cube. A normal photo stores three numbers per pixel: red, green and blue. A
**spectral cube** stores many: one greyscale picture for each **band**, a narrow slice of
wavelengths such as 450 to 455 nm. Each band's picture shows how much light of just those
wavelengths every pixel received. This demo has 96 bands from 450 nm (blue) to 950 nm
(near infrared).

Flip through the bands with the slider under the image (on a keyboard, the **← →** keys do
the same).
"""
show = { mode = "band", band = 550 }

[steps.task]
kind = "band"
prompt = "Go to a band in the near infrared, above 800 nm."
near = 875
tolerance = 75
hint = "Move the slider under the image to the right."
success = "In the near infrared the leaf turns bright: plants reflect a lot of light there that our eyes can't see."
retry = "Not yet: that band is below 800 nm. Keep going to the right."

[[steps]]
title = "Every pixel is a spectrum"
figure = { kind = "cube", focus = "pixel" }
text = """
Look at the cube the other way: pick one pixel and read its value in every band. That curve
is the pixel's **spectrum**, and it says what the material is made of far better than its
colour does.

The image now shows a colour composite so you can tell the objects apart.
"""
show = { mode = "rgb", rgb = [640, 550, 465], specView = "values" }

[steps.task]
kind = "pixel"
region = "leaf"
prompt = "Click anywhere on the leaf."
success = "The curve in the plot below is the leaf's spectrum. Notice the steep jump around 700 nm: that is the 'red edge' of plants."
retry = "That's not the leaf. It's the large shape on the left."

[[steps]]
title = "Different materials, different curves"
figure = { kind = "spectrum", show = "compare" }
text = """
Every material has its own spectral fingerprint. Pins stay on the image and their spectra stay
in the plot, so you can compare them.
"""

[steps.task]
kind = "pixel"
region = "pill_b"
prompt = "Now click one of the two lower discs on the right."
hint = "The lower discs are the greenish ones."
success = "Two pins, two curves. This disc peaks in the green and has a bump near 880 nm, a pattern the leaf doesn't share."
retry = "Close, but that's not one of the two lower discs."

[[steps]]
title = "The cube in 3D"
figure = { kind = "cube", focus = "band" }
text = """
Here is the whole cube as a solid block. The top face is one band; the sides show how every
pixel along the edges changes across wavelengths.

Drag to rotate, zoom with the mouse wheel or a pinch, and use the sliders in the panel to cut
into the cube.

Next, *Bands and wavelengths* looks at what the bands show, and why the same leaf looks so
different from one band to the next.
"""
view = "3d"

[[steps]]
title = "Check yourself"
figure = { kind = "cube", focus = "stack" }
text = "This demo is 192 × 256 pixels with 96 bands."
view = "image"

[steps.task]
kind = "choice"
prompt = "How many numbers does the cube hold?"
options = ["About 4.7 million", "49,152", "About 470,000", "96"]
answer = 0
success = "Right: 192 × 256 × 96 = 4,718,592 numbers. Real cubes are often a hundred times larger, which is why fast tools matter."
retry = "Count every pixel in every band: rows × columns × bands."
