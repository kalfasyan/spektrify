id = "fourier"
title = "The frequency domain"
summary = "Every image is a sum of waves. The Fourier transform shows which ones, turns stripes into spikes and blurs into multiplications."
level = "intermediate"
unit = "Filters"
order = 50
demo = "scene"
reading = [
  "Gonzalez & Woods, *Digital Image Processing* (4th ed.), ch. 4: filtering in the frequency domain (DFT, convolution theorem, low/high-pass, notch filters).",
  "Torralba, Isola & Freeman, *Foundations of Computer Vision*, chapters on the Fourier transform and blur.",
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 3: Fourier transforms.",
]

[[steps]]
title = "Images are sums of waves"
figure = { kind = "waves", show = "sum" }
text = """
*Sharpening* separated fine detail from coarse structure. The Fourier transform makes that
idea exact: it splits an image into waves of every size.

Any image can be written as a sum of **waves**: stripes of different spacing (frequency),
direction, strength and position. The **Fourier transform** tells you how much of each wave
the image contains.

`fft(nm(800))` shows that strength (on a log scale) for every wave. The centre is
frequency zero (the overall brightness); points further out are finer waves; the direction
from the centre is the direction the wave varies in. Smooth images concentrate near the
centre; edges and noise spread outwards.
"""
show = { mode = "math", mathExpr = "fft(nm(800))", cmap = "magma" }

[[steps]]
title = "Stripes become spikes"
text = """
Band 76 (850 nm) has vertical stripes that repeat about every 5 pixels. In its Fourier
transform, `fft(b[76])`, a repeating pattern is essentially one wave (plus its
harmonics), so it shows up as a few bright **spikes** instead of being spread across the
whole image.

The faint line through the centre has another source: the dead column. A single sharp
vertical line contains every left-to-right frequency at once.
"""
show = { mode = "math", mathExpr = "fft(b[76])", cmap = "magma" }

[steps.task]
kind = "choice"
prompt = "Where do the spikes from vertical stripes appear?"
options = [
  "On the vertical axis, since the stripes themselves run up and down",
  "On the horizontal axis: the stripes vary from left to right",
  "In the corners, since stripes are a kind of fine detail",
]
answer = 1
success = "Right. A pattern that changes along x sits on the horizontal frequency axis. A 'notch' filter that zeroes just those spikes removes the stripes and little else."
retry = "Vertical stripes change as you move left to right, not up and down."

[[steps]]
title = "Low-pass and high-pass"
figure = { kind = "waves", show = "filter" }
text = """
To see filtering clearly, use a test pattern instead of the scene. This **zone plate**,
`cos(((x - 128)**2 + (y - 96)**2) / 150)`, is made of rings that get finer towards the edges: low frequencies in the centre,
high frequencies outside. (`x` and `y` are each pixel's column and row.)

Filtering in the frequency domain means multiplying the transform by a mask and
transforming back. `lowpass(…, 0.15)` fades out waves above about 15% of the highest
frequency: the coarse central rings survive and the fine outer ones fade to grey. Try
`highpass` in the band-math box: exactly the opposite. On real images, low-pass is blur and
high-pass is edges, texture and noise.
"""
show = { mode = "math", mathExpr = "lowpass(cos(((x - 128)**2 + (y - 96)**2) / 150), 0.15)", cmap = "gray" }

[[steps]]
title = "The convolution theorem"
text = """
The key fact of this lesson: **convolution in the image equals multiplication in the
frequency domain**. A Gaussian blur multiplies the transform by another Gaussian, which
fades the high frequencies. That is why blurring and low-pass filtering are the same thing.

It is also practical: a large kernel is much faster to apply with an FFT than by sliding it
over the image.

The shape of a kernel's transform tells you how it treats each wave. A Gaussian's transform
is a smooth Gaussian: fine waves fade steadily. A box's transform is not smooth: it falls,
then ripples up again (**side lobes**), and some ripples are negative. So a box blur lets
some fine patterns through, and those with negative weight come out with their contrast
flipped.

Next, *Sampling, aliasing and pyramids* uses these waves to explain what goes wrong when
an image is made smaller.
"""

[steps.task]
kind = "choice"
prompt = "A box filter's Fourier transform has ripples (side lobes). What does that mean for blurring?"
options = [
  "It lets some fine patterns through, some with contrast flipped",
  "Nothing: every blur removes fine patterns in exactly the same way",
  "It blurs more strongly than any Gaussian ever can",
]
answer = 0
success = "Right. This is the frequency-domain reason the Gaussian is the preferred blur."
retry = "Ripples mean some high frequencies survive, with alternating sign."
