id = "convolution"
title = "Neighbourhoods and convolution"
summary = "Replace each pixel by a weighted average of its neighbours: the kernel, box and Gaussian blur, and why convolution is the workhorse of vision."
level = "intermediate"
unit = "Filters"
order = 10
demo = "scene"
reading = [
  "Gonzalez & Woods, *Digital Image Processing* (4th ed.), ch. 3: fundamentals of spatial filtering, smoothing filters.",
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 3: linear filtering, separable filtering.",
  "Torralba, Isola & Freeman, *Foundations of Computer Vision*, chapters on linear filters and blur.",
]

[[steps]]
title = "A very noisy band"
figure = { kind = "kernel", op = "box" }
text = """
Every operation in the basics looked at one pixel at a time. Filters also look at its
neighbours.

This band (471 nm, band 4) is buried in noise: every pixel is off by a random amount,
independently of its neighbours. But neighbouring pixels usually show the *same* material.
So averaging a pixel with its neighbours keeps the signal and averages the noise away.
"""
show = { mode = "band", band = "#4", cmap = "gray" }

[[steps]]
title = "The box filter"
text = """
The simplest fix: replace each pixel by the average of the square around it.
`box(b[4], 2)` uses a 5 × 5 square, 25 pixels in all.

How much does that help? Each pixel's error is random: some are too high, some too low, so
in an average they partly cancel. They don't cancel completely, though, and the rule is the
square-root rule from *Exposure, noise and dynamic range*: averaging 4 values halves the
typical error, averaging 25 cuts it to a fifth (√25 = 5), averaging 100 to a tenth. It is the
same reason you average many runs of a benchmark instead of trusting one.

The grid of weights used in the average (here 25 equal weights of 1/25 each) is called the
**kernel**. Sliding the kernel across the image and computing the weighted sum at every
position is called **convolution**. If you have written a sliding-window loop over a 2-D
array, you have written a convolution.

At the image border part of the square falls outside. Something has to fill it in: zeros
(which darken the border), the nearest pixel, or a mirror image. spektrify mirrors.
"""
show = { mode = "math", mathExpr = "box(b[4], 2)", cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "Averaging 25 pixels with independent noise divides the noise's standard deviation by…"
options = ["2", "5", "12.5", "25"]
answer = 1
success = "Right: by √25 = 5. Noise averages down with the square root of the number of samples, which is why halving noise costs four times the pixels."
retry = "Independent noise averages down with the square root of the number of samples."

[[steps]]
title = "The Gaussian filter"
figure = { kind = "kernel", op = "gauss" }
text = """
The box gives a pixel in the corner of the square as much say as the centre pixel, which
is a bit crude: nearer neighbours are more likely to show the same thing. A **Gaussian
kernel** fixes that. Its weights follow the familiar bell curve: largest in the middle and
fading smoothly with distance. One number, **σ** (sigma, in pixels), sets how wide the bell
is: weights are still large within about σ of the centre and nearly zero beyond 3σ.
Here σ = 1.5: `gauss(b[4], 1.5)`.

The Gaussian is the default blur in image processing. It treats all directions alike, it
creates no blocky artefacts, and blurring twice is the same as blurring once with a wider
bell. The widths combine like the sides of a right-angled triangle (the same Pythagoras
rule as for combining noises): σ = 6 followed by σ = 8 equals one blur with σ = 10, since
6² + 8² = 10².
"""
show = { mode = "math", mathExpr = "gauss(b[4], 1.5)", cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "You blur with σ = 3, then again with σ = 4. Which single blur gives the same result?"
options = ["σ = 5", "σ = 7", "σ = 12"]
answer = 0
success = "Right: variances add, 3² + 4² = 5². Chaining Gaussians is how image pyramids and scale spaces are built."
retry = "It's the variances (σ²) that add, not σ."

[[steps]]
title = "Why convolution is everywhere"
text = """
Convolution has two properties that make it the workhorse of image processing:

- **Linear**: filtering the sum of two images gives the same result as filtering each and
  adding the results, and making an image twice as bright makes the filtered image twice
  as bright.
- **Shift-invariant**: the same kernel is used everywhere, so an object is treated the same
  way wherever it sits in the image.

Any operation with both properties is a convolution. Box and Gaussian kernels have a third,
practical property: they are **separable**. A 2-D blur equals a blur along each row
followed by a blur along each column. For a 15 × 15 kernel that is 15 + 15 = 30
multiplications per pixel instead of 15 × 15 = 225. The convolutional networks at the end of the
course are stacks of exactly this operation, with kernels learned from data.

Next, *Noise and denoising* compares this kind of averaging with filters that handle other
kinds of noise better.
"""

[steps.task]
kind = "choice"
prompt = "A separable 15 × 15 kernel. Roughly how many multiplications per pixel does it need when done as two 1-D passes?"
options = ["15", "30", "225"]
answer = 1
success = "Right: 15 + 15 = 30 instead of 225. That factor matters on large images and cubes."
retry = "Each 1-D pass needs 15 multiplications per pixel."
