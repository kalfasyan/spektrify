id = "optics"
title = "Lenses, focus and blur"
summary = "Why cameras need lenses, what the f-number trades, and the three limits on sharpness: defocus, diffraction and aberrations."
level = "basics"
unit = "How images are captured"
order = 53
demo = "scene"
reading = [
  "E. Hecht, *Optics* (5th ed., 2017): chapters on geometrical optics, aberrations and diffraction.",
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 2: optics, lenses, aperture, vignetting and chromatic aberration.",
  "Torralba, Isola & Freeman, *Foundations of Computer Vision*, chapters on pinhole cameras and lenses.",
  "J. W. Goodman, *Introduction to Fourier Optics* (4th ed., 2017): the point spread function and why imaging is a convolution.",
]

[[steps]]
title = "Pinholes and lenses"
figure = { kind = "camera", show = "pinhole" }
text = """
*Exposure, noise and dynamic range* was about the sensor. Before light reaches it, something
has to form a sharp image on it. Start with the simplest camera there is.

**A pinhole.** Make a tiny hole in one side of a dark box. Light from each point of the
scene can only pass through the hole along one straight line, so it lands on one spot of
the back wall, and an upside-down image appears. The catch: a tiny hole lets in very little
light. Make the hole bigger and each scene point lights up a larger patch instead of a spot,
so the image gets brighter but blurrier.

**A lens** gets you both brightness and sharpness. It is a piece of curved glass that bends
light, so that all the rays from one scene point, wherever they enter the lens, meet again
at one point behind it. How strongly a lens bends light is described by its **focal
length f**: the distance behind the lens at which light from something very far away comes
to a point. A strongly curved lens has a short focal length.

For nearer objects the sharp image lies a little further back. The thin-lens rule says
where: an object at distance u is sharp at distance v behind the lens when
**1/f = 1/u + 1/v**. For example, a 50 mm lens looking at something 1 m (1,000 mm) away
gives 1/v = 1/50 − 1/1000, so v ≈ 52.6 mm. The sensor sits at one distance, so **only one
object distance is perfectly sharp at a time**; that is what focusing adjusts.

The focal length also decides how much of the scene fits on the sensor, the **field of
view**. A longer focal length makes everything look bigger, like zooming in: doubling f
doubles the size of each object in the image, so the sensor covers half as wide a slice of
the scene. (The full geometry is in the advanced lesson *Cameras and image formation*.)
"""
show = { mode = "band", band = 550, cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "You swap a 25 mm lens for a 50 mm lens on the same camera. What happens?"
options = [
  "The view widens and objects look half as large",
  "The view narrows and objects look twice as large",
  "The view stays the same and the image gets brighter",
]
answer = 1
success = "Right: magnification grows with focal length, so the same sensor covers half the width of the scene."
retry = "A longer focal length acts like a zoom."

[[steps]]
title = "Aperture and f-number"
figure = { kind = "camera", show = "lens" }
text = """
The **aperture** is the opening that lets light through the lens, like the pupil of your
eye. Photographers describe it by the **f-number**, the focal length divided by the
opening's diameter: **N = f / D**. A 50 mm lens with a 25 mm wide opening is at f/2; close
the opening to about 6 mm and it is at f/8. So a *small* f-number means a *wide* opening.

How much light reaches each pixel? Two things matter. The light collected grows with the
**area** of the opening, and area goes with the diameter squared: halve the diameter and
you get a quarter of the light. Meanwhile, a longer focal length spreads the image over a
larger area, which dims it in the same squared way. Together, the light per pixel goes as
(D / f)², which is **1 / N²**.

A worked example: going from f/4 to f/8 doubles N, so the light drops to (1/2)² = 1/4.
That is why the standard f-numbers (f/2.8, f/4, f/5.6, f/8, …) step by about 1.4 (that is,
√2): each step halves the light. Photographers call one such halving a **stop**. To keep
the same signal, and so the same SNR, after closing the aperture by one stop, you double
the exposure time.
"""

[steps.task]
kind = "choice"
prompt = "You close the aperture from f/4 to f/8. How must the exposure time change to keep the same signal?"
options = ["2 times longer", "4 times longer", "8 times longer", "It doesn't need to change"]
answer = 1
success = "Right: (8 / 4)² = 4, two stops. That is why fast-moving scenes need wide apertures or bright lights."
retry = "Doubling the f-number halves the diameter of the opening. What does that do to its area?"

[[steps]]
title = "Defocus is a blur by a disc"
text = """
What happens to a point that is *not* at the focused distance? Its rays meet a little in
front of or behind the sensor, so on the sensor they form a small disc instead of a point.
That disc is called the **circle of confusion**. A wider opening sends rays in from a wider
range of angles, so the disc is bigger. That is why closing the aperture (a larger N)
increases the **depth of field**: the range of distances that still look sharp.

A useful way to think about any blur: the image of one single point of light is called the
lens's **point spread function (PSF)**, the shape that a point gets smeared into. Every
point of the scene is smeared in the same way, so the blurred image is what you get if you
stamp a copy of that shape onto every point, scaled by its brightness, and add all the
copies up. That operation is called **convolution**. If you have seen a sliding-window or
kernel operation in code, it is the same idea; *Neighbourhoods and convolution* builds it
up properly.

Here the PSF is a disc of radius 4 pixels: `defocus(nm(550), 4)`. Edges are softened by a
fixed amount all round, with a fairly hard-edged blur, unlike the smoother Gaussian blur you
will meet later.
"""
show = { mode = "math", mathExpr = "defocus(nm(550), 4)", cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "Part of your sample is out of focus. What helps without moving anything?"
options = [
  "Open the aperture (smaller f-number) to let in more light",
  "Keep the aperture as it is and expose for longer",
  "Close the aperture (larger f-number) and expose longer",
]
answer = 2
success = "Right: a smaller opening shrinks the blur circles, at the cost of light. But don't stop down too far: diffraction is next."
retry = "The blur circle's size grows with the size of the opening."

[[steps]]
title = "Diffraction: the limit of a perfect lens"
text = """
Even a perfect lens can't focus light to an infinitely small point. The reason is that light
is a wave, and waves spread out after passing through an opening. You can see the same thing
with sea waves: when they pass through a narrow harbour entrance they fan out on the other
side instead of continuing as a straight strip. This spreading is called **diffraction**,
and the narrower the opening compared with the wavelength, the more the wave spreads.

For a camera this means a point becomes a small bright spot with faint rings around it,
called the **Airy pattern**. The diameter of the central spot is about
**2.44 · λ · N**: it grows with the wavelength λ and with the f-number N (a smaller
opening spreads the light more).

With numbers: at 550 nm (0.55 µm, where a µm or micrometre is a thousandth of a millimetre)
and f/8, the spot is 2.44 × 0.55 × 8 ≈ 10.7 µm across. On a sensor with 3.45 µm pixels that
is about three pixels wide. So closing the aperture has a limit: it sharpens defocus, but
beyond some f-number the diffraction spot gets bigger than the defocus disc it saves.

Note the λ in the rule: at the same f-number, longer wavelengths spread more. A near
infrared band is blurrier than a blue one, so a spectral cube is not equally sharp in every
band.
"""

[steps.task]
kind = "choice"
prompt = "How large is the diffraction spot at 1000 nm and f/4?"
options = ["About 1 µm", "About 2.4 µm", "About 10 µm", "About 100 µm"]
answer = 2
success = "Right: 2.44 × 1 µm × 4 ≈ 9.8 µm. The same lens at 500 nm would give 4.9 µm."
retry = "Use 2.44 · λ · N, with λ = 1000 nm = 1 µm and N = 4."

[[steps]]
title = "Aberrations and vignetting"
text = """
Real lenses add imperfections of their own:

- **Chromatic aberration**: glass bends short wavelengths a little more than long ones, the
  same effect that lets a prism make a rainbow. So each wavelength comes to focus at a
  slightly different distance (some bands are blurrier) and with a slightly different
  size (bands don't line up near the corners). Lenses made for spectral imaging are
  corrected over a wide range of wavelengths for this reason.
- **Geometric distortion**: straight lines in the scene bow outwards or inwards near the
  edges of the image (barrel or pincushion distortion).
- **Vignetting**: the image gets darker towards the corners. Light reaching the corners
  arrives at a slant, so it is spread over a larger area of the sensor (the cos⁴ law
  describes how much), and part of it is cut off by the lens barrel. The demo scene has it:
  the background is darker near the corners.

One problem remains: the sensor still can't tell colours apart. Next, *Colour filter
arrays and demosaicing* shows how ordinary cameras solve it.
"""

[steps.task]
kind = "choice"
prompt = "A uniform white board looks darker in the corners, by the same factor in every frame. How do you remove it?"
options = [
  "Divide by an image of a uniform white target (a flat field)",
  "Subtract an image taken with the lens cap on (a dark frame)",
  "Blur the image so the dark corners blend into the centre",
]
answer = 0
success = "Right. Vignetting multiplies the signal, so it is divided out, together with the pixel-to-pixel sensitivity differences. The lesson *From raw counts to reflectance* does exactly this."
retry = "Vignetting scales the light by a fixed factor per pixel. What undoes a multiplication?"
