id = "optics"
title = "Lenses, focus and blur"
summary = "Why cameras need lenses, what the f-number trades, and the three limits on sharpness: defocus, diffraction and aberrations."
level = "basics"
unit = "How images are captured"
order = 53
demo = "scene"
reading = [
  "E. Hecht, *Optics* (5th ed., 2017): chapters on geometrical optics, aberrations and diffraction.",
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 2: optics, lenses, aperture, vignetting and chromatic aberration.",
  "Torralba, Isola & Freeman, *Foundations of Computer Vision*, chapters on pinhole cameras and lenses.",
  "J. W. Goodman, *Introduction to Fourier Optics* (4th ed., 2017): the point spread function and why imaging is a convolution.",
]

[[steps]]
title = "Pinholes and lenses"
text = """
A tiny hole in a dark box already makes an image: each point of the scene sends a thin
cone of light through the hole to one spot on the back wall. But a pinhole lets in very
little light, and widening it blurs the image.

A **lens** solves this: it bends all the light from one scene point, entering anywhere
across its opening, back to one image point. For a thin lens with **focal length f**, a
point at distance u is sharp at distance v behind the lens when **1/f = 1/u + 1/v**. Only
one distance is perfectly in focus at a time.

The focal length also sets the **field of view**: the longer f, the narrower the view and
the larger objects appear. (The geometry of projection is in the advanced lesson *Cameras
and image formation*.)
"""
show = { mode = "band", band = 550, cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "You swap a 25 mm lens for a 50 mm lens on the same camera. What happens?"
options = [
  "The view narrows and objects appear twice as large",
  "The image gets twice as bright",
  "The view widens",
]
answer = 0
success = "Right: magnification grows with focal length, so the same sensor covers half the width of the scene."
retry = "A longer focal length acts like a zoom."

[[steps]]
title = "Aperture and f-number"
text = """
The lens opening (the **aperture**) is described by the **f-number N = f / D**, the focal
length divided by the opening's diameter. f/2 is a wide opening, f/16 a small one.

The light reaching each pixel goes as the area of the opening relative to f², so as
**1 / N²**. The standard steps (f/2.8, f/4, f/5.6, f/8, …) differ by √2 and each halves
the light: one **stop**. A larger N therefore needs a longer exposure for the same signal
and SNR.
"""

[steps.task]
kind = "choice"
prompt = "You close the aperture from f/4 to f/8. How must the exposure time change to keep the same signal?"
options = ["4 times longer", "2 times longer", "It doesn't need to change", "8 times longer"]
answer = 0
success = "Right: (8 / 4)² = 4, two stops. That is why fast-moving scenes need wide apertures or bright lights."
retry = "Light goes as 1 / N². Compare (1/4)² with (1/8)²."

[[steps]]
title = "Defocus is a blur by a disc"
text = """
A point that is not at the focused distance spreads into a small disc on the sensor, the
**circle of confusion**. Its size grows with the aperture diameter, so stopping down (a
larger N) increases the **depth of field**, the range of distances that look sharp.

The image of a single point is the lens's **point spread function (PSF)**. Every point of
the scene spreads the same way, so the whole image is the sharp image **convolved** with
the PSF. Here it is with a disc of radius 4 pixels: `defocus(nm(550), 4)`. Compare its edges
with the Gaussian blur you'll meet in *Neighbourhoods and convolution*: a disc gives a
flatter, harder-edged blur.
"""
show = { mode = "math", mathExpr = "defocus(nm(550), 4)", cmap = "gray" }

[steps.task]
kind = "choice"
prompt = "Part of your sample is out of focus. What helps without moving anything?"
options = [
  "Close the aperture (larger f-number) and expose longer",
  "Open the aperture (smaller f-number)",
  "Use a longer exposure at the same aperture",
]
answer = 0
success = "Right: a smaller opening shrinks the blur circles, at the cost of light. But don't stop down too far: diffraction is next."
retry = "The blur circle's size grows with the size of the opening."

[[steps]]
title = "Diffraction: the limit of a perfect lens"
text = """
Even a flawless lens can't focus light to a point, because light is a wave. A point becomes
a small bright spot with faint rings, the **Airy pattern**. Its central spot, out to the
first dark ring, has a diameter of about **2.44 · λ · N**.

At 550 nm and f/8 that is about 10.7 µm, three pixels on a sensor with 3.45 µm pixels. So
closing the aperture has a limit: beyond some f-number, diffraction blur grows faster than
depth of field helps. Note the **λ**: at the same f-number, NIR bands are blurred more than
blue ones, so a spectral cube is not equally sharp at every wavelength.
"""

[steps.task]
kind = "choice"
prompt = "How large is the diffraction spot at 1000 nm and f/4?"
options = ["About 10 µm", "About 1 µm", "About 100 µm", "About 2.4 µm"]
answer = 0
success = "Right: 2.44 × 1 µm × 4 ≈ 9.8 µm. The same lens at 500 nm would give 4.9 µm."
retry = "Use 2.44 · λ · N, with λ = 1 µm."

[[steps]]
title = "Aberrations and vignetting"
text = """
Real lenses add their own imperfections:

- **Chromatic aberration**: glass bends short wavelengths more than long ones, so each
  wavelength focuses at a slightly different distance (some bands are blurrier) and with a
  slightly different magnification (bands don't line up near the corners). Lenses for
  spectral imaging are corrected over a wide wavelength range for this reason.
- **Geometric distortion**: straight lines bend near the borders (barrel or pincushion).
- **Vignetting**: the image gets darker towards the corners, partly from the geometry of
  light hitting the sensor at an angle (the cos⁴ law) and partly from the lens barrel
  cutting off light. The demo scene has it: the background is darker near the corners.
"""

[steps.task]
kind = "choice"
prompt = "A uniform white board looks darker in the corners, by the same factor in every frame. How do you remove it?"
options = [
  "Divide by an image of a uniform white target (a flat field)",
  "Blur the image",
  "Subtract a dark frame",
]
answer = 0
success = "Right. Vignetting multiplies the signal, so it is divided out, together with the pixel-to-pixel sensitivity differences. The lesson *From raw counts to reflectance* does exactly this."
retry = "Vignetting scales the light by a fixed factor per pixel. What undoes a multiplication?"
