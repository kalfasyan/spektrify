id = "anomaly"
title = "Finding the unusual"
summary = "RX and PCA residuals flag pixels unlike the rest of the scene, without knowing what to look for."
level = "advanced"
unit = "Statistics without labels"
order = 70
demo = "scene"
reading = [
  "I. S. Reed & X. Yu, 'Adaptive multiple-band CFAR detection of an optical pattern with unknown spectral distribution', *IEEE Trans. ASSP* 38(10), 1990.",
  "D. Manolakis & G. Shaw, 'Detection algorithms for hyperspectral imaging applications', *IEEE Signal Processing Magazine* 19(1), 2002.",
]

[[steps]]
title = "The RX detector"
figure = { kind = "scatter", show = "anomaly" }
text = """
**RX** learns what the scene looks like on average (the mean spectrum and how bands vary
together) and scores every pixel by how far it is from that: its *Mahalanobis distance*.
This is a distance measured in units of the scene's own spread: a step in a direction where
the bands normally vary a lot counts little, the same step in an unusual direction counts a
lot. So anything unlike the bulk of the scene, a rare material or a faulty pixel, scores
high.
Bright means unusual.

Global RX models the whole scene as one bell-shaped (Gaussian) cloud. Real scenes hold
several materials, so local versions (statistics from a window around each pixel) or
per-cluster versions usually work better.
"""
view = "image"
show = { mode = "anomaly", anomaly = "rx", anomalyTop = 0 }

[steps.task]
kind = "pixel"
region = "target"
prompt = "Find the small bright spot near the top of the image and click it."
hint = "Above the leaf's right side. Zoom in."
success = "That little disc has a narrow peak at 760 nm that no other material shares."
retry = "Not that one. Look for a small spot near the top, just right of the middle."

[[steps]]
title = "Keep only the top scores"
text = "Here only the 0.2% highest-scoring pixels are highlighted."
show = { mode = "anomaly", anomaly = "rx", anomalyTop = 0.2 }

[steps.task]
kind = "choice"
prompt = "RX also flags the saturated white square left of the leaf. Why?"
options = [
  "They are targets too",
  "Sensor defects are unlike the background as well, so they look anomalous",
  "RX is broken",
]
answer = 1
success = "Right. Repair defects first (or expect them in the results), otherwise they crowd out real targets."
retry = "RX only knows 'different from the scene', not why."

[[steps]]
title = "PCA residual"
text = """
Another way: keep the top *k* principal components as a model of the scene and look at what
they **can't** explain. Rare materials end up in the residual.
"""
show = { mode = "anomaly", anomaly = "residual", anomalyK = 3, anomalyTop = 0 }
