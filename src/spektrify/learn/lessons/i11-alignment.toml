id = "alignment"
title = "Aligning the bands"
summary = "When bands don't line up, edges get colour fringes and spectra mix neighbouring pixels."
level = "intermediate"
unit = "From raw data to clean data"
order = 110
demo = "capture"
reading = [
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 9: translational alignment (including phase correlation).",
  "B. Zitová & J. Flusser, 'Image registration methods: a survey', *Image and Vision Computing* 21(11), 2003.",
]

[[steps]]
title = "Colour fringes"
text = """
After *From raw counts to reflectance* the values are right. With some cameras the
positions are not: each band can be slightly shifted.

Filter-wheel and snapshot cameras record each band through a slightly different optical path,
so the bands can be shifted by a pixel or two. In a composite this shows up as **colour
fringes** along edges.

Zoom into the edge of a disc or the leaf.
"""
show = { mode = "rgb", rgb = [830, 640, 545] }
pipeline = []

[steps.task]
kind = "choice"
prompt = "What causes the coloured rims?"
options = [
  "The objects really have thin coloured borders around their edges",
  "The display's colour map exaggerates the edges of bright objects",
  "The bands don't line up, so each band shows the edge elsewhere",
]
answer = 2
success = "Right. Here the bands are shifted by up to two pixels."
retry = "Every object has the rims, always in the same directions. What would do that?"

[[steps]]
title = "Register the bands"
figure = { kind = "pipeline" }
text = """
The **align** step compares every band with a reference band (the middle one by default),
finds the shift that matches them best, and moves the band back. The shifts it found are kept
in the cube's metadata.

Toggle **Before / After** and watch the fringes disappear.
"""
pipeline = [{ name = "align" }]

[[steps]]
title = "Why it matters"
text = """
Misaligned bands don't just look bad: a pixel's spectrum then mixes values from different
places.

Next, *Repairing defects* fixes the dead pixels and stripes found in *Spotting sensor
problems*.
"""

[steps.task]
kind = "choice"
prompt = "Why align before computing an index such as (NIR − red) / (NIR + red)?"
options = [
  "An index is a ratio, so shifts cancel and only the display suffers",
  "Otherwise edge pixels combine values from different places",
  "Misalignment only blurs the index slightly, which is harmless",
]
answer = 1
success = "Yes. Along every edge the index would compare the object in one band with the background in the other."
retry = "Think about a pixel right on the edge of the leaf."
