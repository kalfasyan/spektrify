id = "camera"
title = "Cameras and image formation"
summary = "The pinhole model, intrinsics and distortion, calibration, and why scanning cameras need a different geometric model."
level = "advanced"
unit = "Features and geometry"
order = 20
reading = [
  "Hartley & Zisserman, *Multiple View Geometry* (2nd ed.), ch. 6: camera models.",
  "Ma, Soatto, Košecká & Sastry, *An Invitation to 3-D Vision*, ch. 3: image formation.",
  "Szeliski, *Computer Vision: Algorithms and Applications* (2nd ed.), ch. 2: image formation (geometry, photometry, the digital camera).",
  "Z. Zhang, 'A flexible new technique for camera calibration', *IEEE TPAMI* 22(11), 2000.",
  "R. Gupta and R. I. Hartley, 'Linear pushbroom cameras', *IEEE TPAMI* 19(9), 1997.",
]

[[steps]]
title = "The pinhole camera"
text = """
The simplest camera model is a pinhole. A point at (X, Y, Z) in front of the camera lands
on the image at **x = f·X / Z, y = f·Y / Z**, where f is the focal length. Dividing by depth
Z is **perspective**: far things look smaller and parallel lines meet at vanishing points.

The **intrinsic** parameters (focal length in pixels, the image centre, pixel shape) go in a
3 × 3 matrix K. The **extrinsic** ones, a rotation R and translation t, say where the
camera is. Together: **x ≃ K [R | t] X**, the projection matrix.
"""

[steps.task]
kind = "choice"
prompt = "An object moves from 1 m to 2 m away from the camera. What happens to its image?"
options = [
  "Its width halves and its area drops to a quarter",
  "Its width and its area both halve",
  "It stays the same size",
]
answer = 0
success = "Right: width and height both halve (x = f·X/Z), so the area drops to a quarter. Fewer pixels per object also means more noise in its average spectrum."
retry = "x = f·X/Z: what happens to x when Z doubles, and to the area?"

[[steps]]
title = "Lenses and calibration"
text = """
Real lenses bend straight lines near the image border (**radial distortion**: barrel or
pincushion; the basics lesson *Lenses, focus and blur* covers the optics). **Calibration**
estimates K and the distortion from photos of a known pattern, typically a checkerboard in
several poses (Zhang's method). Measuring sizes or combining cameras without calibration
gives errors that grow towards the image corners.
"""

[steps.task]
kind = "choice"
prompt = "You measure the length of parts anywhere in the image. What must you do first?"
options = [
  "Calibrate the camera and correct the lens distortion",
  "Increase the exposure",
  "Convert to reflectance",
]
answer = 0
success = "Right. Reflectance calibration fixes values; geometric calibration fixes positions."
retry = "The question is about positions and lengths, not values."

[[steps]]
title = "Scanning cameras have their own geometry"
text = """
The pinhole model assumes the whole image is taken at one instant from one centre of
projection. A **push-broom** camera (see *How spectral cameras capture a cube*) breaks that:
each line is a separate exposure from a different position along the motion.

The result is the **linear push-broom model**: perspective *across* the slit, as in a
pinhole camera, but close to parallel projection *along* the motion, with a scale set by the
speed. So a square seen by a push-broom camera can come out as a rectangle, straight lines
stay straight only when the motion is steady, and calibration has to estimate the motion
as well as K. Filter-wheel and snapshot cameras are frame cameras and follow the pinhole
model, with one subtlety: each band can have a slightly different K (chromatic
aberration), so bands are calibrated or aligned separately.
"""

[steps.task]
kind = "choice"
prompt = "A push-broom camera on a conveyor belt makes round parts look oval. Which parameter of its geometric model is off?"
options = [
  "The along-track scale (belt speed × line period)",
  "The focal length",
  "The lens distortion",
]
answer = 0
success = "Right. Across the slit the camera behaves like a pinhole camera; along the belt, the scale comes from the motion, so a speed mismatch stretches or squashes everything."
retry = "In which direction does the push-broom camera's image come from motion rather than from the lens?"
