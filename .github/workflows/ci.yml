name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: The prebuilt UI in the package is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/spektrify/static)" ]; then
            echo "::error::src/spektrify/static is stale. Run 'npm run build' in frontend/ and commit it."
            git status --short -- src/spektrify/static
            exit 1
          fi

  site:
    # The online learn-mode demo (deployed by Vercel from vercel.json): it must build, and
    # every lesson's data must export. The result is kept as an artifact to inspect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/build-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/site
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # version comes from git tags
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Wheel installs and ships the UI
        run: |
          uv venv /tmp/smoke && . /tmp/smoke/bin/activate
          uv pip install dist/*.whl
          spektrify --version
          python -c "import spektrify, pathlib; assert (pathlib.Path(spektrify.__file__).parent / 'static/index.html').exists()"
